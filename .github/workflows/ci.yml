name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # The application targets macOS 26, so the build needs the macOS 26 SDK,
    # which only the macOS 26 image carries. That image is Apple Silicon.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install dependencies
        run: brew bundle

      # Homebrew lives under /opt/homebrew on Apple Silicon, and configure
      # only writes local.rave with the /usr/local paths when none exists.
      - name: Point the build at Homebrew
        run: |
          printf 'add FLAGS    "-I/opt/homebrew/include"\n' >  local.rave
          printf 'add LN_FLAGS "-L/opt/homebrew/lib"\n'     >> local.rave

      - name: Configure
        run: ./configure

      - name: Build
        run: script/build

      - name: Test
        env:
          TM_TEST_READ_ONLY_VOLUME: "1"
        run: script/test
