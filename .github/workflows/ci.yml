name: CI

# A branch with a pull request runs once, for the pull request. Main runs on
# every push, which is each merge. Running on both events doubled every push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The application targets macOS 27, and this is the macOS 27 image: 27.0.1
    # with Xcode 27 and the 27 SDK. GitHub names its macOS images by Xcode once
    # a release is new, so this is `xcode-27` rather than `macos-27`, and it is
    # in preview. When a `macos-27` label appears it is the same system and
    # this should move to it.
    # The image is Apple Silicon.
    runs-on: xcode-27

    # Uploading gtm to the release needs write access to repository contents.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The build number is the commit count, which a shallow clone
          # would report as one.
          fetch-depth: 0

      # The Ruby configure checks for, down to the patch, read from the one
      # file that names it, so this never restates the pin.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Install dependencies
        run: brew bundle

      # Homebrew lives under /opt/homebrew on Apple Silicon, and configure
      # only writes local.rave with the /usr/local paths when none exists.
      - name: Point the build at Homebrew
        run: |
          printf 'add FLAGS    "-I/opt/homebrew/include"\n' >  local.rave

      - name: Configure
        run: ./configure

      - name: Build
        run: script/build

      - name: Test
        env:
          TM_TEST_READ_ONLY_VOLUME: "1"
        run: script/test

      # The grammar test tool, published on the gtm prerelease from every push to
      # main, for bundle workflows that run on runners without TextMate. The tag
      # moves to the commit the tool was built from, so the release page always
      # points at the source of the file it carries.
      - name: Publish gtm
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gtm=$(find "$HOME/build" -path '*/TextMate.app/Contents/MacOS/gtm' -type f | head -1)
          test -n "$gtm" || { echo "gtm not found under $HOME/build"; exit 1; }
          git tag --force gtm "$GITHUB_SHA"
          git push --force origin refs/tags/gtm
          gh release upload gtm "$gtm" --clobber
