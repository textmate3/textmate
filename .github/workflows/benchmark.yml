name: Benchmarks

# Runs on pull requests only, apart from CI, so the build and test verdict is
# never held up by a benchmark run. The pull request and main are built and
# run on the same runner, turn and turn about, since a number from one shared
# runner against a number from another is noise.
#
# The report goes to the job summary and never fails the pull request. A false
# red on a shared runner would teach everyone to ignore the check. Once a few
# weeks of pull requests have shown the noise floor, a threshold can fail it.
on:
  pull_request:

permissions:
  contents: read

# A new push to the pull request makes the run in progress moot.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # The same image as CI, see ci.yml for why it is named by Xcode.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # All history, so the merge commit's first parent is there to build.
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Install dependencies
        run: brew bundle

      - name: Configure
        run: ./configure

      # The checkout is the pull request merged onto main, so its first parent
      # is the main it was merged onto, and the two differ by the pull request
      # alone. origin/main can be newer than that parent when main moved and
      # GitHub has not yet merged the pull request onto it again.
      #
      # The report is the script's stdout, its progress is stderr. The report
      # goes to the log and to the job summary, where it renders as a table.
      #
      # A slow benchmark never fails the job, but a harness that cannot build
      # or run does. The shell named outright runs with pipefail, so the
      # script's exit status survives the pipe into tee. The default shell
      # does not, and a failed base build would show as a green check.
      - name: Benchmark against main
        shell: bash
        run: script/benchmark --compare HEAD^1 --json benchmarks.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Every sample from both sides, with the load average of each run, kept
      # with the run. The noise floor a failing threshold waits on is measured
      # from these, across pull requests, rather than read off the summaries.
      - name: Keep every sample
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-pull-request-${{ github.event.pull_request.number }}
          path: benchmarks.json
